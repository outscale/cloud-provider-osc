name: E2E

on:
  push:
    branches:
      - kubernetes-*
  pull_request:
    branches:
      - main
      - kubernetes-*
    paths:
      - "**.go"
      - "Dockerfile"
      - "Makefile"
      - "go.*"
      - "deploy/k8s-osc-ccm/**.yaml"
      - ".github/workflows/e2e_test.yml"
      - ".github/local_action/start_ccm_e2e/action.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  e2e:
    runs-on: [self-hosted, linux, kube]
    steps:
    - name: ⬇️ Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: ⬇️ Install kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: v1.34.9
    - name: ⬇️ Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v4.3.0
    - name: ⬇️ Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: ⬇️ Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: 🧹 Frieza
      id: secrets
      uses: outscale/.github/vault-frieza-clean@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        vault_role: outscale-cloud-provider-osc
        exclude_resource_types: access_key
    - name: ⬇️ Install octl
      uses: outscale/octl/.github/actions/setup_octl@03e63a67e6eaa5cab021eccf4d9c25a681903165 # v0.0.35
      with:
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 🐳 Login to Harbor
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ vars.REGISTRY }}
        username: ${{ secrets.HARBOR_USER }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: 📦 Build Docker image
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: 'v2.15.4'
        args: release --clean --snapshot
    - name: 📦 Push the Docker image
      run: |
        make image-tag image-push
      env:
        IMAGE: "outscale/cloud-provider-osc"
        IMAGE_TAG: "${{ github.sha }}-amd64"
        REGISTRY_IMAGE: "${{ vars.REGISTRY }}/outscale/cloud-provider-osc"
        REGISTRY_TAG: ${{ github.sha }}

    - name: 👷 Deploy Cluster
      id: caposc
      uses: outscale/.github/kube-setup@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      timeout-minutes: 40
      with:
        OSC_REGION: ${{ steps.secrets.outputs.region }}
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
        IMAGE_NAME: ${{ vars.OMI_NAME }}
        WORKER_COUNT: 2
        CCM: "false"
        ALLOW_FROM: ${{ vars.ALLOW_FROM }}
        vault_role: outscale-cloud-provider-osc
        vault_token: ${{ steps.secrets.outputs.vault_token }}
    - name: 🔎 Fetch Cluster ID
      id: clusterid
      run: |
        cid=`kubectl get -n ${{ env.CLUSTER_NAME }} osccluster.infrastructure.cluster.x-k8s.io/${{ env.CLUSTER_NAME }} -o json | jq -r '.metadata.labels."outscale.com/clusterUID"'`
        echo "clusterid=$cid" | tee $GITHUB_OUTPUT
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/management.kubeconfig"
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
    - name: 🔐 Configure credentials
      run: |
        octl kube secret --name osc-secret | kubectl apply -f -
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 👷 Install CCM
      run: |
        echo "installing CCM"
        helm install --wait k8s-osc-ccm deploy/k8s-osc-ccm --set oscSecretName=osc-secret --set image.repository=${{ vars.REGISTRY }}/outscale/cloud-provider-osc --set oscSecretFormat=v1 --set image.tag=${{ github.sha }} \
          --set extraLoadBalancerTags.clikey=clivalue --set "extraNodeLabels.clilabel=\{\{ .SubRegion \}\}" --set verbose=6
        echo "waiting for worker nodes"
        kubectl wait --for=condition=Ready nodes --all --timeout=900s
        kubectl get nodes -o wide
        echo "waiting for pods"
        kubectl wait --for=condition=Ready po --all -A --timeout=900s
        kubectl get po -A
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 🧪 Run e2e tests
      id: e2etest
      timeout-minutes: 90
      run: |
        make e2etest
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        CCM_IMAGE: "${{ vars.REGISTRY }}/outscale/cloud-provider-osc:${{ github.sha }}"
    - name: 👷 Reconfigure CCM in remote mode
      id: setupremote
      run: |
        echo "updating CCM config"
        helm upgrade --wait k8s-osc-ccm deploy/k8s-osc-ccm --set oscSecretName=osc-secret --set image.repository=${{ vars.REGISTRY }}/outscale/cloud-provider-osc --set image.tag=${{ github.sha }}\
          --set extraLoadBalancerTags.clikey=clivalue --set "extraNodeLabels.clilabel=\{\{ .SubRegion \}\}" --set remote=true --set customClusterID=$CLUSTER_ID --set verbose=6
        sleep 5
        kubectl get pod -n kube-system -l "app=osc-cloud-controller-manager"
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        CLUSTER_ID: ${{ steps.clusterid.outputs.clusterid }}
    - name: 🧪 Run e2e tests in remote mode
      id: e2remote
      timeout-minutes: 45
      run: |
        E2E_FOCUS=fast make e2etest
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 👷 Reconfigure CCM with credentials in profile file
      run: |
        profile="{\"default\":{\"access_key\":\"${{ env.OSC_ACCESS_KEY }}\",\"secret_key\":\"${{ env.OSC_SECRET_KEY }}\"}}"
        kubectl create secret generic osc-secret-file --from-literal=config.json=$profile -n kube-system
        echo "updating CCM config"
        helm upgrade --wait k8s-osc-ccm deploy/k8s-osc-ccm --set oscSecretName=osc-secret-file --set oscCredentialsFromFile=true --set image.repository=${{ vars.REGISTRY }}/outscale/cloud-provider-osc --set image.tag=${{ github.sha }}\
          --set extraLoadBalancerTags.clikey=clivalue --set "extraNodeLabels.clilabel=\{\{ .SubRegion \}\}" --set verbose=6
        sleep 5
        kubectl get pod -n kube-system -l "app=osc-cloud-controller-manager"
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
        OSC_ACCESS_KEY: ${{ steps.secrets.outputs.access_key }}
        OSC_SECRET_KEY: ${{ steps.secrets.outputs.secret_key }}
        OSC_REGION: ${{ steps.secrets.outputs.region }}
    - name: 🧪 Run e2e tests with credentials in profile file
      id: e2eprofile
      timeout-minutes: 45
      run: |
        E2E_FOCUS=fast make e2etest
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 📝 Get CCM logs
      run: |
        kubectl logs -l app=osc-cloud-controller-manager -n kube-system --tail=-1 | grep -v "successfully renewed lease"
      if: ${{ failure() }}
      shell: bash
      env:
        KUBECONFIG: "${{ github.workspace }}/workload.kubeconfig"
    - name: 🧹 Teardown test cluster
      if: ${{ always() }}
      uses: outscale/.github/kube-teardown@98c7b1b43a6ffe54858f960aee70c98991035bff # v1.5.0
      with:
        CLUSTER_NAME: ${{ steps.secrets.outputs.osc_account }}
