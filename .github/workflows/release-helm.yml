name: Release Helm

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-helm:
    if: ${{ contains(github.ref, 'helm') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⬇️ Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: 📦 Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.15.4'
          args: release --clean --config .goreleaser-helm.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{secrets.DOCKER_USER_HELM}}
          password: ${{secrets.DOCKER_PASSWORD_HELM}}
      - name : ⬆️ Push to Docker Hub
        run:
          make helm-push
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER_HELM}}
